name: Build APK with Custom Docker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t gofro-builder .

      - name: Build APK
        run: |
          docker run --rm \
            -v $(pwd):/home/user/hostcwd \
            -v ~/.buildozer:/home/user/.buildozer \
            --user root \
            gofro-builder \
            android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gofroagregat-apk
          path: bin/*.apk
          if-no-files-found: error
