name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build APK with Docker
        run: |
          docker run \
            --rm \
            -v $(pwd):/home/user/hostcwd \
            kivy/buildozer:latest \
            /bin/sh -c "
              cd /home/user/hostcwd
              echo '=== Python version ==='
              python3 --version
              echo '=== Starting build ==='
              yes | buildozer android debug
            "

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gofroagregat-apk
          path: bin/*.apk
          if-no-files-found: error
