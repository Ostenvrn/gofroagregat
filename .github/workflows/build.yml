name: Build APK with Custom Docker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Build Docker image
        run: |
          docker build -t gofro-builder .

      - name: Build APK
        run: |
          docker run \
            --rm \
            -v $(pwd):/home/user/build \
            -v ~/.buildozer:/home/user/.buildozer \
            -e USER=user \
            gofro-builder \
            bash -c "eval \"\$(pyenv init --path)\" && yes | buildozer android debug"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gofroagregat-apk
          path: bin/*.apk
          if-no-files-found: error
