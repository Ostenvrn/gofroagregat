name: Build APK with Docker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Show files for debug
        run: |
          ls -la
          cat buildozer.spec | head -20

      - name: Build APK with Docker
        run: |
          # Проверяем, что файл buildozer.spec существует
          if [ ! -f "buildozer.spec" ]; then
            echo "❌ buildozer.spec not found!"
            exit 1
          fi
          
          # Сборка через Docker (используем правильный тег)
          docker run \
            --rm \
            -v $(pwd):/home/user/hostcwd \
            -v ~/.buildozer:/home/user/.buildozer \
            -e USER=runner \
            kivy/buildozer:latest \
            android debug

      - name: Check if APK was created
        run: |
          if [ -d "bin" ]; then
            echo "✅ APK found!"
            ls -la bin/
          else
            echo "❌ No bin folder found!"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gofroagregat-apk
          path: bin/*.apk
          if-no-files-found: error
