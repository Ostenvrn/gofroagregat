name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build APK
        run: |
          docker run --rm \
            -v $(pwd):/home/user/hostcwd \
            kivy/buildozer:latest \
            sh -c "
              cd /home/user/hostcwd
              # Применяем патч для libthorvg
              cp fix_libthorvg.patch /tmp/
              cd /home/user/.buildozer/android/platform/python-for-android
              patch -p1 < /tmp/fix_libthorvg.patch 2>/dev/null || true
              cd /home/user/hostcwd
              yes | buildozer android debug
            "

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gofroagregat-apk
          path: bin/*.apk
          if-no-files-found: error
